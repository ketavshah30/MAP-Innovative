name: member-checks
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python member-1-platform/tools/check_workspace.py
      - run: python -m unittest discover -s member-1-platform/tests -p 'test_*.py'
      - run: node member-1-platform/tools/bootstrap.mjs
      - run: docker compose --env-file .local/dev.env -f member-1-platform/compose.yaml config --quiet
      - name: Enforce one member label and ownership boundary
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python member-1-platform/tools/check_pr.py
  personalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci && npm run build && npm test
        working-directory: member-2-personalization
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r member-2-personalization/requirements.txt
      - run: python -m unittest discover -s member-2-personalization/tests -p 'test_*.py'
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B verify
        working-directory: member-3-catalog
  billing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - run: dotnet test tests/Billing.Tests.csproj
        working-directory: member-4-billing
  playback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.6', cache-dependency-path: member-5-playback/go.sum}
      - run: go test ./... && go vet ./...
        working-directory: member-5-playback
