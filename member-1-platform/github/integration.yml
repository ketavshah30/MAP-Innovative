name: local-integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    # Use an isolated runner with at least 12 GB allocated to Docker.
    runs-on: [self-hosted, linux, streaming]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: node member-1-platform/tools/bootstrap.mjs
      - run: docker compose --env-file .local/dev.env -f member-1-platform/compose.yaml up --build -d
      - run: python member-1-platform/tests/smoke.py
      - if: always()
        run: docker compose --env-file .local/dev.env -f member-1-platform/compose.yaml down
